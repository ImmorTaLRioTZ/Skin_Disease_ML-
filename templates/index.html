<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Disease Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
            <h2>🩺 Skin Disease Diagnosis AI</h2>
        </div>
        <div class="card-body">
            <form action="/predict" method="post" enctype="multipart/form-data">
                
                <div class="mb-4 text-center">
                    <label for="file" class="form-label fw-bold">Step 1: Upload Image of Lesion</label>
                    <input class="form-control" type="file" id="file" name="file" accept="image/*" required>
                </div>

                <hr>

                <h4 class="mb-3 text-center">Step 2: Symptom Check</h4>
                <p class="text-muted text-center">Please answer the following questions honestly.</p>

                <div class="row">
                    {% for key, label in symptoms %}
                    <div class="col-md-6 mb-3">
                        <div class="card h-100">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <span class="fw-bold">{{ label }}?</span>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="{{ key }}" id="{{ key }}_yes" value="1">
                                        <label class="form-check-label" for="{{ key }}_yes">Yes</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="{{ key }}" id="{{ key }}_no" value="0" checked>
                                        <label class="form-check-label" for="{{ key }}_no">No</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Analyze Case</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
